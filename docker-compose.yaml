services:
  # app serves the UI & API, it registers user interactions into the database (pg)
  pwb-app:
    image: maayanlab/playbook-partnership:0.81.1-ui
    build:
      context: .
      dockerfile: Dockerfile
      target: app_minimal
    init: true
    cap_add:
    - SYS_ADMIN
    platform: linux/amd64
    x-kubernetes:
      imagePullPolicy: IfNotPresent
      annotations:
        maayanlab.cloud/ingress: ${PROD_PUBLIC_URL}
        nginx.ingress.kubernetes.io/enable-cors: "true"
    ports:
    - 3000
    deploy:
      # unsure if this can be replicated atm
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 1024M
    environment:
    - PUBLIC_URL=${PROD_PUBLIC_URL}
    - LANDING_PAGE
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_GOOGLE
    - BETTER_AUTH_ORCID
    - BETTER_AUTH_KEYCLOAK
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_GOOGLE
    - BETTER_AUTH_ORCID
    - BETTER_AUTH_KEYCLOAK
    - EMAIL_SERVER
    - EMAIL_FROM
    - DATABASE_URL
    - NEXT_PUBLIC_MATOMO_URL
    - NEXT_PUBLIC_MATOMO_SITE_ID
    - OPENAI_API_KEY
    - OPENAI_MODEL
    - ELYSIUM_USERNAME
    - ELYSIUM_PASSWORD
    - N_WORKERS=0
  # the workers should be replicated,
  #   they deal with creating "Resolved" entries for submitted Processes.
  pwb-worker:
    image: maayanlab/playbook-partnership:0.81.1
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    platform: linux/amd64
    x-kubernetes:
      imagePullPolicy: IfNotPresent
    deploy:
      replicas: 4
      resources:
        limits:
          memory: 4096M
          cpus: '1'
        reservations:
          memory: 1024M
          cpus: '0.25'
    command: ["npm", "run", "start:worker"]
    environment:
    - PUBLIC_URL=${PROD_PUBLIC_URL}
    - DATABASE_URL
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_SECRET
    - ELYSIUM_USERNAME
    - ELYSIUM_PASSWORD
    - N_WORKERS=5
    - OPENAI_API_KEY
    - OPENAI_MODEL
  # the database is used by everything, apply migrations with
  #  `DATABASE_URL=postgres://... npm run db:migrate`
  pwb-pg:
    image: postgres:15
    restart: unless-stopped
    environment:
    - POSTGRES_DB
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    ports:
    - 5432:5432
    volumes:
    - pwb-pg:/var/lib/postgresql/data
  # app-dev serves a dev version of the app
  app-dev:
    image: maayanlab/playbook-partnership:0.81.1-dev
    x-kubernetes:
      annotations:
        maayanlab.cloud/ingress: ${DEV_PUBLIC_URL}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    init: true
    cap_add:
    - SYS_ADMIN
    platform: linux/amd64
    deploy:
      # this can be safely replicated if necessary but an ingress will be required
      replicas: 0
    environment:
    - PUBLIC_URL=${DEV_PUBLIC_URL}
    - LANDING_PAGE
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_GOOGLE
    - BETTER_AUTH_ORCID
    - BETTER_AUTH_KEYCLOAK
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_GOOGLE
    - BETTER_AUTH_ORCID
    - BETTER_AUTH_KEYCLOAK
    - EMAIL_SERVER
    - EMAIL_FROM
    - DATABASE_URL
    - NEXT_PUBLIC_MATOMO_URL
    - NEXT_PUBLIC_MATOMO_SITE_ID
    - OPENAI_API_KEY
    - N_WORKERS
  # a playbook-partnership development environment
  #  doesn't run in production, just for convenience
  dev:
    image: maayanlab/playbook-partnership-dev:0.78.0
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    platform: linux/amd64
    x-kubernetes:
      exclude: true
    ports:
    - 3000:3000
    deploy:
      replicas: 0
    user: "${DOCKER_USER}"
    volumes:
    - ./:/app

volumes:
  pwb-pg:
    x-kubernetes:
      size: 5Gi
      class: ${KUBE_STORAGE_CLASS:-}

x-kubernetes:
  name: pwb
  namespace: pwb
