services:
  # app serves the UI & API, it registers user interactions into the database (pg)
  pwb-app:
    image: maayanlab/playbook-partnership:0.81.0-ui
    build:
      context: .
      dockerfile: Dockerfile
      target: app_minimal
    init: true
    cap_add:
    - SYS_ADMIN
    platform: linux/amd64
    deploy:
      # this can be safely replicated if necessary but an ingress will be required
      replicas: 1
    environment:
    - PUBLIC_URL
    - LANDING_PAGE
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_GOOGLE
    - BETTER_AUTH_ORCID
    - BETTER_AUTH_KEYCLOAK
    - NEXTAUTH_SECRET
    - NEXTAUTH_GOOGLE
    - NEXTAUTH_ORCID
    - NEXTAUTH_KEYCLOAK
    - EMAIL_SERVER
    - EMAIL_FROM
    - DATABASE_URL
    - NEXT_PUBLIC_MATOMO_URL
    - NEXT_PUBLIC_MATOMO_SITE_ID
    - OPENAI_API_KEY
    - OPENAI_MODEL
    - ELYSIUM_USERNAME
    - ELYSIUM_PASSWORD
    - N_WORKERS=0
    ports:
      - 3000
    x-kubernetes:
      imagePullPolicy: IfNotPresent
      annotations:
        maayanlab.cloud/ingress: ${PUBLIC_URL}
  # the workers should be replicated,
  #   they deal with creating "Resolved" entries for submitted Processes.
  pwb-worker:
    image: maayanlab/playbook-partnership:0.81.0
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    platform: linux/amd64
    x-kubernetes:
      imagePullPolicy: IfNotPresent
    deploy:
      # this can be safely replicated as necessary
      replicas: 2
    command: ["npm", "run", "start:worker"]
    environment:
    - PUBLIC_URL
    - DATABASE_URL
    - BETTER_AUTH_SECRET
    - NEXTAUTH_SECRET
    - ELYSIUM_USERNAME
    - ELYSIUM_PASSWORD
    - N_WORKERS=5
    - OPENAI_API_KEY
    - OPENAI_MODEL
  # the database is used by everything, apply migrations with
  #  `DATABASE_URL=postgres://... npm run db:migrate`
  pwb-pg:
    image: postgres:15
    environment:
    - POSTGRES_DB
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    ports:
    - 5432:5432
    volumes:
    - pwb-pg:/var/lib/postgresql/data
  # app-dev serves a dev version of the app
  app-dev:
    image: maayanlab/playbook-partnership:0.81.1-dev
    x-kubernetes:
      annotations:
        maayanlab.cloud/ingress: https://dev.playbook-workflow-builder.cloud
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    init: true
    cap_add:
    - SYS_ADMIN
    platform: linux/amd64
    deploy:
      # this can be safely replicated if necessary but an ingress will be required
      replicas: 0
    environment:
    - PUBLIC_URL
    - LANDING_PAGE
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_GOOGLE
    - BETTER_AUTH_ORCID
    - BETTER_AUTH_KEYCLOAK
    - NEXTAUTH_SECRET
    - NEXTAUTH_GOOGLE
    - NEXTAUTH_ORCID
    - NEXTAUTH_KEYCLOAK
    - EMAIL_SERVER
    - EMAIL_FROM
    - DATABASE_URL
    - NEXT_PUBLIC_MATOMO_URL
    - NEXT_PUBLIC_MATOMO_SITE_ID
    - OPENAI_API_KEY
    - N_WORKERS
    x-kubernetes:
      exclude: true
  # a playbook-partnership development environment
  #  doesn't run in production, just for convenience
  dev:
    image: maayanlab/playbook-partnership-dev:0.78.0
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    platform: linux/amd64
    x-kubernetes:
      exclude: true
    ports:
    - 3000:3000
    deploy:
      replicas: 0
    user: "${DOCKER_USER}"
    volumes:
    - ./:/app
volumes:
  pwb-pg:
    x-kubernetes:
      size: 5Gi
      class: ${KUBE_STORAGE_CLASS:-}

x-kubernetes:
  name: pwb
  namespace: pwb
